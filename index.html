<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c1218" />
  <title>Rain Window v3</title>
  <style>
    :root{
      --text: rgba(245,248,252,.94);
      --muted: rgba(235,240,245,.76);
      --glass: rgba(8,14,20,.30);
      --line: rgba(255,255,255,.13);
      --shadow: 0 12px 45px rgba(0,0,0,.34);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:#0b1118;
      color:var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body{
      position:relative;
      background:
        linear-gradient(rgba(7,10,14,.14), rgba(7,10,14,.24)),
        url("./background-rain-window.png") center center / cover no-repeat fixed;
    }

    .backdrop{
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 120%, rgba(90,110,120,.08), transparent 38%),
        linear-gradient(180deg, rgba(0,0,0,.06), rgba(0,0,0,.20));
      backdrop-filter: blur(.6px);
    }

    .mist{
      position:fixed;
      inset:-10%;
      pointer-events:none;
      opacity:.12;
      filter: blur(55px);
      background:
        radial-gradient(circle at 15% 30%, rgba(200,220,235,.35), transparent 15%),
        radial-gradient(circle at 75% 20%, rgba(180,205,220,.25), transparent 18%),
        radial-gradient(circle at 65% 85%, rgba(200,215,230,.18), transparent 20%);
      animation: drift 26s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to   { transform: translate3d(3%, 2%, 0) scale(1.05); }
    }

    #waterCanvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      pointer-events:none;
      z-index:2;
    }

    .panel-wrap{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      padding:24px;
      pointer-events:none;
      z-index:5;
    }

    .panel{
      pointer-events:auto;
      width:min(540px, calc(100vw - 32px));
      padding:22px 22px 18px;
      border:1px solid var(--line);
      border-radius:22px;
      background:var(--glass);
      backdrop-filter: blur(14px) saturate(115%);
      -webkit-backdrop-filter: blur(14px) saturate(115%);
      box-shadow: var(--shadow);
      transition: opacity .28s ease, transform .28s ease;
    }

    .panel.hidden{
      opacity:0;
      transform: translateY(8px) scale(.985);
      pointer-events:none;
    }

    h1{
      margin:0 0 6px;
      font-size:clamp(24px,4vw,36px);
      font-weight:650;
      letter-spacing:-.03em;
    }

    .subtitle{
      margin:0 0 16px;
      color:var(--muted);
      line-height:1.5;
      font-size:14px;
    }

    .controls{
      display:grid;
      gap:14px;
    }

    .top-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .soft-btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.08);
      color:var(--text);
      min-height:40px;
      padding:0 14px;
      border-radius:999px;
      font:inherit;
      cursor:pointer;
      transition:.18s ease;
    }

    .soft-btn:hover{
      transform: translateY(-1px);
      background:rgba(255,255,255,.12);
    }

    .range{
      display:grid;
      grid-template-columns: 92px 1fr 50px;
      gap:12px;
      align-items:center;
      font-size:14px;
      color:var(--muted);
    }

    input[type="range"]{
      width:100%;
      accent-color:#e3eef5;
      cursor:pointer;
    }

    .cat-launch{
      position:fixed;
      right:18px;
      bottom:18px;
      width:68px;
      height:62px;
      border:none;
      background:transparent;
      padding:0;
      cursor:pointer;
      z-index:10;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
      transition: transform .18s ease, opacity .18s ease;
    }

    .cat-launch:hover{ transform: translateY(-1px) scale(1.03); }
    .cat-launch:active{ transform: scale(.97); }

    .cat-launch svg{ width:100%; height:100%; display:block; }

    .cat-status{
      position:fixed;
      right:18px;
      bottom:88px;
      max-width:240px;
      padding:8px 11px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(10,16,22,.48);
      color: var(--muted);
      font-size:12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      z-index:10;
      user-select:none;
    }

    .hint{
      position:fixed;
      left:16px;
      bottom:16px;
      padding:8px 11px;
      color:rgba(240,243,247,.64);
      font-size:12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(10,16,22,.30);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index:10;
    }

    @media (max-width:640px){
      .panel{padding:18px 16px 16px}
      .range{grid-template-columns: 80px 1fr 42px; gap:8px;}
      .cat-launch{right:14px; bottom:14px; width:62px; height:58px;}
      .cat-status{right:14px; bottom:78px;}
      .hint{left:10px; right:88px; bottom:10px}
    }
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="mist"></div>
  <canvas id="waterCanvas"></canvas>

  <div class="panel-wrap">
    <section class="panel" id="panel">
      <h1>Rain Window</h1>
      <p class="subtitle">
        Теперь по стеклу текут капли и струйки. Нажми на кошку, чтобы включить или выключить звук дождя.
      </p>

      <div class="controls">
        <div class="top-row">
          <button class="soft-btn" id="hideBtn">Скрыть интерфейс</button>
          <button class="soft-btn" id="fullscreenBtn">На весь экран</button>
        </div>

        <label class="range">
          <span>Громкость</span>
          <input id="volume" type="range" min="0" max="100" value="42" />
          <span id="volumeValue">42%</span>
        </label>

        <label class="range">
          <span>Интенсив.</span>
          <input id="intensity" type="range" min="10" max="100" value="56" />
          <span id="intensityValue">56</span>
        </label>
      </div>
    </section>
  </div>

  <div class="cat-status" id="catStatus">Кошка спит. Нажми, чтобы запустить дождь.</div>

  <button class="cat-launch" id="catBtn" aria-label="Запустить или остановить дождь" title="Запустить или остановить дождь">
    <svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
      <path d="M26 40 L36 14 L54 33 Q60 30 66 33 L84 14 L94 40 Q104 52 104 66 Q104 84 90 95 Q76 106 60 106 Q44 106 30 95 Q16 84 16 66 Q16 52 26 40 Z"
            fill="rgba(30,35,40,.92)" stroke="rgba(255,255,255,.20)" stroke-width="2"/>
      <ellipse cx="48" cy="62" rx="4.7" ry="6.2" fill="#eef4f8"/>
      <ellipse cx="72" cy="62" rx="4.7" ry="6.2" fill="#eef4f8"/>
      <path d="M52 79 Q60 86 68 79" fill="none" stroke="#eef4f8" stroke-width="4" stroke-linecap="round"/>
      <path d="M60 68 L56 74 H64 Z" fill="#eef4f8"/>
      <path id="playIcon" d="M56 47 L56 77 L80 62 Z" fill="rgba(180,205,220,.85)"/>
      <g id="pauseIcon" style="display:none">
        <rect x="52" y="48" width="8" height="28" rx="2" fill="rgba(180,205,220,.9)"/>
        <rect x="66" y="48" width="8" height="28" rx="2" fill="rgba(180,205,220,.9)"/>
      </g>
    </svg>
  </button>

  <div class="hint">H — показать/скрыть панель · F — полный экран · двойной клик — вернуть панель</div>

  <script>
    // --------------------------
    // UI
    // --------------------------
    const panel = document.getElementById("panel");
    const catBtn = document.getElementById("catBtn");
    const catStatus = document.getElementById("catStatus");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const hideBtn = document.getElementById("hideBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const volumeInput = document.getElementById("volume");
    const volumeValue = document.getElementById("volumeValue");
    const intensityInput = document.getElementById("intensity");
    const intensityValue = document.getElementById("intensityValue");

    function setCatState(isPlaying) {
      playIcon.style.display = isPlaying ? "none" : "block";
      pauseIcon.style.display = isPlaying ? "block" : "none";
      catStatus.textContent = isPlaying
        ? "Дождь идёт. Нажми на кошку, чтобы поставить тишину."
        : "Кошка спит. Нажми, чтобы запустить дождь.";
    }

    function togglePanel() {
      panel.classList.toggle("hidden");
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (e) {}
    }

    hideBtn.addEventListener("click", togglePanel);
    fullscreenBtn.addEventListener("click", toggleFullscreen);
    document.body.addEventListener("dblclick", () => panel.classList.remove("hidden"));
    addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "h") togglePanel();
      if (e.key.toLowerCase() === "f") toggleFullscreen();
    });

    // --------------------------
    // AUDIO: realistic rain bed + roof + metal drops
    // --------------------------
    let audioCtx = null;
    let masterGain = null;
    let ambienceGain = null;
    let roofGain = null;
    let metalGain = null;
    let lowRumbleGain = null;
    let baseNoiseSource = null;
    let lowNoiseSource = null;
    let playing = false;
    let dropTimers = [];

    function createNoiseBuffer(ctx, seconds = 8, tone = "pinkish") {
      const length = Math.floor(ctx.sampleRate * seconds);
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);

      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;
        if (tone === "pinkish") {
          b0 = 0.99765 * b0 + white * 0.0990460;
          b1 = 0.96300 * b1 + white * 0.2965164;
          b2 = 0.57000 * b2 + white * 1.0526913;
          data[i] = (b0 + b1 + b2 + white * 0.1848) * 0.17;
        } else {
          data[i] = white * 0.25;
        }
      }
      return buffer;
    }

    function ensureAudio() {
      if (audioCtx) return;

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0001;
      masterGain.connect(audioCtx.destination);

      ambienceGain = audioCtx.createGain();
      ambienceGain.gain.value = 0.34;

      roofGain = audioCtx.createGain();
      roofGain.gain.value = 0.45;

      metalGain = audioCtx.createGain();
      metalGain.gain.value = 0.22;

      lowRumbleGain = audioCtx.createGain();
      lowRumbleGain.gain.value = 0.16;

      ambienceGain.connect(masterGain);
      roofGain.connect(masterGain);
      metalGain.connect(masterGain);
      lowRumbleGain.connect(masterGain);

      baseNoiseSource = audioCtx.createBufferSource();
      baseNoiseSource.buffer = createNoiseBuffer(audioCtx, 10, "pinkish");
      baseNoiseSource.loop = true;

      const hp = audioCtx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = 700;

      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 7000;

      baseNoiseSource.connect(hp);
      hp.connect(lp);
      lp.connect(ambienceGain);

      lowNoiseSource = audioCtx.createBufferSource();
      lowNoiseSource.buffer = createNoiseBuffer(audioCtx, 10, "white");
      lowNoiseSource.loop = true;

      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = "lowpass";
      lowpass.frequency.value = 260;

      lowNoiseSource.connect(lowpass);
      lowpass.connect(lowRumbleGain);

      baseNoiseSource.start();
      lowNoiseSource.start();
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function triggerRoofDrop() {
      if (!audioCtx || !playing) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(rand(170, 260), now);

      const toneFilter = audioCtx.createBiquadFilter();
      toneFilter.type = "bandpass";
      toneFilter.frequency.value = rand(500, 1100);
      toneFilter.Q.value = rand(2, 5);

      const noise = audioCtx.createBufferSource();
      noise.buffer = createNoiseBuffer(audioCtx, 0.18, "white");

      const noiseHP = audioCtx.createBiquadFilter();
      noiseHP.type = "highpass";
      noiseHP.frequency.value = rand(1800, 3200);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(rand(0.018, 0.05), now + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + rand(0.09, 0.18));

      osc.connect(toneFilter);
      toneFilter.connect(gain);
      noise.connect(noiseHP);
      noiseHP.connect(gain);
      gain.connect(roofGain);

      osc.start(now);
      osc.stop(now + 0.22);
      noise.start(now);
      noise.stop(now + 0.16);
    }

    function triggerMetalDrop() {
      if (!audioCtx || !playing) return;
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      osc1.type = "sine";
      osc2.type = "sine";
      osc1.frequency.setValueAtTime(rand(1300, 2200), now);
      osc2.frequency.setValueAtTime(rand(2100, 3400), now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(rand(0.02, 0.05), now + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + rand(0.04, 0.11));

      const filter = audioCtx.createBiquadFilter();
      filter.type = "highpass";
      filter.frequency.value = 900;

      const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      if (panner) panner.pan.value = rand(-0.5, 0.5);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      if (panner) {
        gain.connect(panner);
        panner.connect(metalGain);
      } else {
        gain.connect(metalGain);
      }

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.13);
      osc2.stop(now + 0.10);
    }

    function scheduleLoop(fn, getDelay) {
      let cancelled = false;
      function tick() {
        if (cancelled) return;
        if (playing) fn();
        const id = setTimeout(tick, getDelay());
        dropTimers.push(id);
      }
      tick();
      return () => { cancelled = true; };
    }

    let cancelRoofLoop = null;
    let cancelMetalLoop = null;
    let cancelMetalLoop2 = null;

    function clearDropTimers() {
      for (const id of dropTimers) clearTimeout(id);
      dropTimers = [];
      if (cancelRoofLoop) cancelRoofLoop();
      if (cancelMetalLoop) cancelMetalLoop();
      if (cancelMetalLoop2) cancelMetalLoop2();
      cancelRoofLoop = cancelMetalLoop = cancelMetalLoop2 = null;
    }

    function updateVolume() {
      volumeValue.textContent = volumeInput.value + "%";
      if (!audioCtx || !masterGain || !playing) return;
      const target = Math.max(0.0001, Number(volumeInput.value) / 100);
      masterGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.1);
    }

    function updateAudioIntensity() {
      if (!audioCtx) return;
      const n = Number(intensityInput.value) / 100;
      ambienceGain.gain.setTargetAtTime(0.18 + n * 0.38, audioCtx.currentTime, 0.15);
      roofGain.gain.setTargetAtTime(0.18 + n * 0.54, audioCtx.currentTime, 0.15);
      metalGain.gain.setTargetAtTime(0.06 + n * 0.28, audioCtx.currentTime, 0.15);
      lowRumbleGain.gain.setTargetAtTime(0.10 + n * 0.12, audioCtx.currentTime, 0.15);

      if (playing) {
        clearDropTimers();
        const roofBase = () => {
          const t = Number(intensityInput.value);
          return Math.max(35, 230 - t * 1.6 + Math.random() * 60);
        };
        const metalBase = () => {
          const t = Number(intensityInput.value);
          return Math.max(120, 850 - t * 5.5 + Math.random() * 220);
        };
        const metalBase2 = () => {
          const t = Number(intensityInput.value);
          return Math.max(260, 1600 - t * 9 + Math.random() * 350);
        };
        cancelRoofLoop = scheduleLoop(triggerRoofDrop, roofBase);
        cancelMetalLoop = scheduleLoop(triggerMetalDrop, metalBase);
        cancelMetalLoop2 = scheduleLoop(() => { if (Math.random() < 0.75) triggerMetalDrop(); }, metalBase2);
      }
    }

    async function toggleRain() {
      ensureAudio();
      if (audioCtx.state === "suspended") await audioCtx.resume();

      if (!playing) {
        playing = true;
        setCatState(true);
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        masterGain.gain.exponentialRampToValueAtTime(
          Math.max(0.0001, Number(volumeInput.value) / 100),
          audioCtx.currentTime + 1.2
        );
        updateAudioIntensity();
      } else {
        playing = false;
        setCatState(false);
        clearDropTimers();
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setValueAtTime(Math.max(0.0001, masterGain.gain.value), audioCtx.currentTime);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.7);
      }
    }

    catBtn.addEventListener("click", toggleRain);
    volumeInput.addEventListener("input", updateVolume);

    // --------------------------
    // WATER ON GLASS ANIMATION
    // --------------------------
    const canvas = document.getElementById("waterCanvas");
    const ctx = canvas.getContext("2d");
    let width = 0, height = 0, dpr = 1;

    const droplets = [];
    const runners = [];
    const streaks = [];

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildWater();
    }

    function intensityNorm() {
      return Number(intensityInput.value) / 100;
    }

    function randomDroplet(yBiasTop = false) {
      const n = intensityNorm();
      const r = 0.8 + Math.random() * 3.8 + n * 1.0;
      return {
        x: Math.random() * width,
        y: yBiasTop ? Math.random() * height * 0.45 : Math.random() * height,
        r,
        a: 0.05 + Math.random() * 0.18,
        life: 120 + Math.random() * 420,
        wobble: Math.random() * Math.PI * 2,
        speedBias: 0.02 + Math.random() * 0.08 + n * 0.03,
        moving: Math.random() < (0.12 + n * 0.18),
        trail: []
      };
    }

    function newRunner(fromTop = true) {
      const n = intensityNorm();
      const len = 60 + Math.random() * 220 + n * 120;
      return {
        x: Math.random() * width,
        y: fromTop ? -len - Math.random() * 120 : Math.random() * height * 0.3,
        vy: 0.35 + Math.random() * 0.75 + n * 0.85,
        len,
        w: 1 + Math.random() * 1.8 + n * 0.8,
        alpha: 0.05 + Math.random() * 0.13,
        wobble: 8 + Math.random() * 14,
        phase: Math.random() * Math.PI * 2,
        headR: 1.8 + Math.random() * 2.6 + n * 0.8,
        tail: []
      };
    }

    function newStreak() {
      const n = intensityNorm();
      return {
        x: Math.random() * width,
        y: -100 - Math.random() * 220,
        vy: 0.18 + Math.random() * 0.32 + n * 0.35,
        len: 120 + Math.random() * 320 + n * 200,
        w: 0.8 + Math.random() * 1.2,
        alpha: 0.028 + Math.random() * 0.04,
        phase: Math.random() * Math.PI * 2,
        wobble: 5 + Math.random() * 8
      };
    }

    function buildWater() {
      droplets.length = 0;
      runners.length = 0;
      streaks.length = 0;

      const n = intensityNorm();
      const dropletCount = Math.floor(120 + n * 260);
      const runnerCount = Math.floor(7 + n * 18);
      const streakCount = Math.floor(4 + n * 12);

      for (let i = 0; i < dropletCount; i++) droplets.push(randomDroplet(i < dropletCount * 0.4));
      for (let i = 0; i < runnerCount; i++) runners.push(newRunner(true));
      for (let i = 0; i < streakCount; i++) streaks.push(newStreak());
    }

    function drawBlurredDot(x, y, r, alpha) {
      const g = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, r * 0.12, x, y, r);
      g.addColorStop(0, `rgba(255,255,255,${alpha * 0.92})`);
      g.addColorStop(0.55, `rgba(215,230,240,${alpha * 0.45})`);
      g.addColorStop(1, `rgba(215,230,240,0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.22})`;
      ctx.lineWidth = Math.max(.6, r * 0.20);
      ctx.arc(x - r * 0.1, y - r * 0.12, r * 0.75, Math.PI * 1.08, Math.PI * 1.8);
      ctx.stroke();
    }

    function updateDroplets(dt) {
      const n = intensityNorm();

      for (const d of droplets) {
        d.life -= dt * 0.05;
        d.wobble += dt * 0.0015;

        if (!d.moving && Math.random() < 0.0007 + n * 0.002) {
          d.moving = true;
        }

        if (d.moving) {
          const vy = d.speedBias * dt * 0.08 * (0.8 + d.r * 0.12);
          d.y += vy;
          d.x += Math.sin(d.wobble + d.y * 0.012) * 0.05 * d.r;

          if (Math.random() < 0.35) {
            d.trail.push({x: d.x, y: d.y, r: Math.max(0.7, d.r * 0.18), a: d.a * 0.35});
          }

          if (d.trail.length > 10) d.trail.shift();
        }

        d.a += (0.04 + Math.random() * 0.05 - d.a) * 0.014;

        for (const t of d.trail) {
          t.a *= 0.985;
          t.r *= 0.996;
        }
        d.trail = d.trail.filter(t => t.a > 0.01);

        if (d.y > height + 20 || d.life <= 0) {
          Object.assign(d, randomDroplet(true), {y: -Math.random() * 40});
        }
      }

      // merging effect for nearby drops
      for (let i = 0; i < droplets.length; i++) {
        const a = droplets[i];
        for (let j = i + 1; j < droplets.length; j++) {
          const b = droplets[j];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const dist2 = dx * dx + dy * dy;
          const target = (a.r + b.r) * 0.55;
          if (dist2 < target * target && Math.abs(dy) < 12) {
            if (a.r >= b.r) {
              a.r = Math.min(7.5, a.r + b.r * 0.08);
              a.a = Math.min(0.22, (a.a + b.a) * 0.62);
              b.life = 0;
            } else {
              b.r = Math.min(7.5, b.r + a.r * 0.08);
              b.a = Math.min(0.22, (a.a + b.a) * 0.62);
              a.life = 0;
            }
          }
        }
      }
    }

    function drawDroplets() {
      for (const d of droplets) {
        if (d.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(d.trail[0].x, d.trail[0].y);
          for (let i = 1; i < d.trail.length; i++) {
            const p = d.trail[i];
            ctx.lineTo(p.x, p.y);
          }
          ctx.strokeStyle = `rgba(220,235,245,${d.a * 0.09})`;
          ctx.lineWidth = Math.max(0.5, d.r * 0.2);
          ctx.lineCap = "round";
          ctx.stroke();
        }

        drawBlurredDot(d.x, d.y, d.r, d.a);
      }
    }

    function updateRunners(dt) {
      const n = intensityNorm();
      for (const s of runners) {
        s.y += s.vy * dt * 0.06;
        s.phase += dt * 0.0018;
        const headX = s.x + Math.sin(s.phase + s.y * 0.010) * s.wobble;

        s.tail.push({x: headX, y: s.y, r: s.headR, a: s.alpha});
        if (s.tail.length > Math.max(16, Math.floor(s.len / 10))) s.tail.shift();

        if (Math.random() < 0.15 + n * 0.2) {
          droplets.push({
            x: headX + (Math.random() - 0.5) * 6,
            y: s.y + Math.random() * 3,
            r: 0.8 + Math.random() * 1.5,
            a: 0.05 + Math.random() * 0.08,
            life: 90 + Math.random() * 180,
            wobble: Math.random() * Math.PI * 2,
            speedBias: 0.02 + Math.random() * 0.05,
            moving: false,
            trail: []
          });
        }

        if (s.y - s.len > height + 50) {
          Object.assign(s, newRunner(true));
        }
      }
    }

    function drawRunners() {
      for (const s of runners) {
        if (s.tail.length < 2) continue;

        ctx.beginPath();
        ctx.moveTo(s.tail[0].x, s.tail[0].y);
        for (let i = 1; i < s.tail.length; i++) {
          const p = s.tail[i];
          const prev = s.tail[i - 1];
          const mx = (prev.x + p.x) / 2;
          const my = (prev.y + p.y) / 2;
          ctx.quadraticCurveTo(prev.x, prev.y, mx, my);
        }

        ctx.strokeStyle = `rgba(222,236,246,${s.alpha})`;
        ctx.lineWidth = s.w;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();

        ctx.beginPath();
        ctx.strokeStyle = `rgba(255,255,255,${s.alpha * 0.16})`;
        ctx.lineWidth = Math.max(0.4, s.w * 0.35);
        ctx.lineCap = "round";
        ctx.moveTo(s.tail[0].x - s.w * 0.15, s.tail[0].y);
        for (let i = 1; i < s.tail.length; i++) {
          const p = s.tail[i];
          const prev = s.tail[i - 1];
          const mx = (prev.x + p.x) / 2;
          const my = (prev.y + p.y) / 2;
          ctx.quadraticCurveTo(prev.x - s.w * 0.15, prev.y, mx - s.w * 0.12, my);
        }
        ctx.stroke();

        const head = s.tail[s.tail.length - 1];
        drawBlurredDot(head.x, head.y, s.headR, Math.min(0.18, s.alpha * 1.2));
      }
    }

    function updateStreaks(dt) {
      for (const s of streaks) {
        s.y += s.vy * dt * 0.05;
        if (s.y - s.len > height + 60) {
          Object.assign(s, newStreak());
        }
      }
    }

    function drawStreaks() {
      for (const s of streaks) {
        const x1 = s.x + Math.sin(s.phase + s.y * 0.004) * s.wobble;
        const y1 = s.y;
        const x2 = s.x + Math.sin(s.phase + (s.y + s.len) * 0.004) * s.wobble * 0.55;
        const y2 = s.y + s.len;

        const g = ctx.createLinearGradient(x1, y1, x2, y2);
        g.addColorStop(0, "rgba(220,235,245,0)");
        g.addColorStop(0.18, `rgba(220,235,245,${s.alpha * 0.7})`);
        g.addColorStop(0.82, `rgba(220,235,245,${s.alpha})`);
        g.addColorStop(1, "rgba(220,235,245,0)");

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.bezierCurveTo(
          x1 + Math.sin(s.phase + 1.1) * s.wobble * 0.7, y1 + s.len * 0.22,
          x2 - Math.cos(s.phase + 0.7) * s.wobble * 0.7, y1 + s.len * 0.75,
          x2, y2
        );
        ctx.strokeStyle = g;
        ctx.lineWidth = s.w;
        ctx.lineCap = "round";
        ctx.stroke();
      }
    }

    let lastTs = performance.now();

    function render(ts) {
      const dt = Math.min(33, ts - lastTs);
      lastTs = ts;

      ctx.clearRect(0, 0, width, height);

      updateStreaks(dt);
      drawStreaks();

      updateRunners(dt);
      drawRunners();

      updateDroplets(dt);
      drawDroplets();

      // soft sheen layer to suggest wet glass
      const sheen = ctx.createLinearGradient(0, 0, width, height);
      sheen.addColorStop(0, "rgba(255,255,255,0.00)");
      sheen.addColorStop(0.25, "rgba(255,255,255,0.018)");
      sheen.addColorStop(0.52, "rgba(255,255,255,0.010)");
      sheen.addColorStop(1, "rgba(255,255,255,0.00)");
      ctx.fillStyle = sheen;
      ctx.fillRect(0, 0, width, height);

      requestAnimationFrame(render);
    }

    function updateIntensity() {
      intensityValue.textContent = intensityInput.value;
      buildWater();
      updateAudioIntensity();
    }

    intensityInput.addEventListener("input", updateIntensity);
    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    updateIntensity();
    updateVolume();
    setCatState(false);
    requestAnimationFrame(render);
  </script>
</body>
</html>
