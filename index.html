<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c1218" />
  <title>Rain Window</title>
  <style>
    :root{
      --text: rgba(245,248,252,.94);
      --muted: rgba(235,240,245,.76);
      --glass: rgba(8,14,20,.28);
      --line: rgba(255,255,255,.13);
      --shadow: 0 12px 45px rgba(0,0,0,.34);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:#0b1118;
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    }

    body{
      position:relative;
      background:
        linear-gradient(rgba(7,10,14,.10),rgba(7,10,14,.22)),
        url("./background-rain-window.png") center center / cover no-repeat fixed;
    }

    .shade{
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 115%,rgba(110,130,140,.06),transparent 38%),
        linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.18));
    }

    .panel-wrap{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      padding:24px;
      pointer-events:none;
    }

    .panel{
      pointer-events:auto;
      width:min(540px,calc(100vw - 32px));
      padding:22px;
      border:1px solid var(--line);
      border-radius:22px;
      background:var(--glass);
      backdrop-filter:blur(14px) saturate(115%);
      -webkit-backdrop-filter:blur(14px) saturate(115%);
      box-shadow:var(--shadow);
      transition:opacity .28s ease,transform .28s ease;
    }

    .panel.hidden{
      opacity:0;
      transform:translateY(8px) scale(.985);
      pointer-events:none;
    }

    h1{
      margin:0 0 6px;
      font-size:clamp(24px,4vw,36px);
      font-weight:650;
      letter-spacing:-.03em;
    }

    .subtitle{
      margin:0 0 16px;
      color:var(--muted);
      line-height:1.5;
      font-size:14px;
    }

    .controls{display:grid;gap:14px}

    .top-row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    button{
      appearance:none;
      border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.08);
      color:var(--text);
      min-height:40px;
      padding:0 14px;
      border-radius:999px;
      font:inherit;
      cursor:pointer;
      transition:.18s ease;
    }

    button:hover{
      transform:translateY(-1px);
      background:rgba(255,255,255,.12);
    }

    .range{
      display:grid;
      grid-template-columns:96px 1fr 50px;
      gap:12px;
      align-items:center;
      font-size:14px;
      color:var(--muted);
    }

    input[type="range"]{
      width:100%;
      accent-color:#e3eef5;
      cursor:pointer;
    }

    .cat-launch{
      position:fixed;
      right:18px;
      bottom:18px;
      width:68px;
      height:62px;
      border:none;
      background:transparent;
      padding:0;
      cursor:pointer;
      z-index:10;
      filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));
    }

    .cat-launch:hover{background:transparent;transform:translateY(-1px) scale(1.03)}
    .cat-launch:active{transform:scale(.97)}
    .cat-launch svg{width:100%;height:100%;display:block}

    .cat-status{
      position:fixed;
      right:18px;
      bottom:88px;
      max-width:240px;
      padding:8px 11px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(10,16,22,.48);
      color:var(--muted);
      font-size:12px;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:var(--shadow);
      z-index:10;
      user-select:none;
    }

    .hint{
      position:fixed;
      left:16px;
      bottom:16px;
      padding:8px 11px;
      color:rgba(240,243,247,.64);
      font-size:12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(10,16,22,.30);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    @media(max-width:640px){
      .panel{padding:18px 16px}
      .range{grid-template-columns:80px 1fr 42px;gap:8px}
      .cat-launch{right:14px;bottom:14px;width:62px;height:58px}
      .cat-status{right:14px;bottom:78px}
      .hint{left:10px;right:88px;bottom:10px}
    }
  </style>
</head>
<body>
  <div class="shade"></div>

  <div class="panel-wrap">
    <section class="panel" id="panel">
      <h1>Rain Window</h1>
      <p class="subtitle">
        Статичный вид из окна и объёмный дождь: крыша, металл, редкие капли по ведру и далёкая гроза.
      </p>

      <div class="controls">
        <div class="top-row">
          <button id="hideBtn">Скрыть интерфейс</button>
          <button id="fullscreenBtn">На весь экран</button>
        </div>

        <label class="range">
          <span>Громкость</span>
          <input id="volume" type="range" min="0" max="100" value="42">
          <span id="volumeValue">42%</span>
        </label>

        <label class="range">
          <span>Дождь</span>
          <input id="intensity" type="range" min="10" max="100" value="56">
          <span id="intensityValue">56</span>
        </label>
      </div>
    </section>
  </div>

  <div class="cat-status" id="catStatus">Кошка спит. Нажми, чтобы включить дождь.</div>

  <button class="cat-launch" id="catBtn" aria-label="Запустить или остановить дождь">
    <svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg">
      <path d="M26 40 L36 14 L54 33 Q60 30 66 33 L84 14 L94 40 Q104 52 104 66 Q104 84 90 95 Q76 106 60 106 Q44 106 30 95 Q16 84 16 66 Q16 52 26 40 Z"
            fill="rgba(30,35,40,.92)" stroke="rgba(255,255,255,.20)" stroke-width="2"/>
      <ellipse cx="48" cy="62" rx="4.7" ry="6.2" fill="#eef4f8"/>
      <ellipse cx="72" cy="62" rx="4.7" ry="6.2" fill="#eef4f8"/>
      <path d="M52 79 Q60 86 68 79" fill="none" stroke="#eef4f8" stroke-width="4" stroke-linecap="round"/>
      <path d="M60 68 L56 74 H64 Z" fill="#eef4f8"/>
      <path id="playIcon" d="M56 47 L56 77 L80 62 Z" fill="rgba(180,205,220,.85)"/>
      <g id="pauseIcon" style="display:none">
        <rect x="52" y="48" width="8" height="28" rx="2" fill="rgba(180,205,220,.9)"/>
        <rect x="66" y="48" width="8" height="28" rx="2" fill="rgba(180,205,220,.9)"/>
      </g>
    </svg>
  </button>

  <div class="hint">H — скрыть/показать панель · F — полный экран</div>

  <script>
    const panel = document.getElementById("panel");
    const catBtn = document.getElementById("catBtn");
    const catStatus = document.getElementById("catStatus");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const hideBtn = document.getElementById("hideBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const volumeInput = document.getElementById("volume");
    const volumeValue = document.getElementById("volumeValue");
    const intensityInput = document.getElementById("intensity");
    const intensityValue = document.getElementById("intensityValue");

    let audioCtx = null;
    let masterGain = null;
    let ambienceGain = null;
    let roofGain = null;
    let metalGain = null;
    let lowGain = null;
    let bucketGain = null;
    let thunderGain = null;
    let playing = false;

    let roofTimer = null;
    let metalTimer = null;
    let bucketTimer = null;
    let thunderTimer = null;

    function rand(min,max){ return Math.random()*(max-min)+min; }

    function createNoiseBuffer(ctx, seconds=8, pinkish=true){
      const length = Math.floor(ctx.sampleRate*seconds);
      const buffer = ctx.createBuffer(1,length,ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let b0=0,b1=0,b2=0;

      for(let i=0;i<length;i++){
        const white = Math.random()*2-1;
        if(pinkish){
          b0 = .99765*b0 + white*.0990460;
          b1 = .96300*b1 + white*.2965164;
          b2 = .57000*b2 + white*1.0526913;
          data[i] = (b0+b1+b2+white*.1848)*.17;
        }else{
          data[i] = white*.25;
        }
      }
      return buffer;
    }

    function setupAudio(){
      if(audioCtx) return;

      audioCtx = new (window.AudioContext||window.webkitAudioContext)();

      masterGain = audioCtx.createGain();
      masterGain.gain.value = .0001;
      masterGain.connect(audioCtx.destination);

      ambienceGain = audioCtx.createGain();
      roofGain = audioCtx.createGain();
      metalGain = audioCtx.createGain();
      lowGain = audioCtx.createGain();
      bucketGain = audioCtx.createGain();
      thunderGain = audioCtx.createGain();

      ambienceGain.connect(masterGain);
      roofGain.connect(masterGain);
      metalGain.connect(masterGain);
      lowGain.connect(masterGain);
      bucketGain.connect(masterGain);
      thunderGain.connect(masterGain);

      const rain = audioCtx.createBufferSource();
      rain.buffer = createNoiseBuffer(audioCtx,10,true);
      rain.loop = true;

      const hp = audioCtx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = 700;

      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 7200;

      rain.connect(hp);
      hp.connect(lp);
      lp.connect(ambienceGain);
      rain.start();

      const low = audioCtx.createBufferSource();
      low.buffer = createNoiseBuffer(audioCtx,10,false);
      low.loop = true;

      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = "lowpass";
      lowpass.frequency.value = 260;

      low.connect(lowpass);
      lowpass.connect(lowGain);
      low.start();

      updateIntensity();
    }

    function triggerRoofDrop(){
      if(!playing) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      osc.type = "triangle";
      osc.frequency.value = rand(170,270);

      const noise = audioCtx.createBufferSource();
      noise.buffer = createNoiseBuffer(audioCtx,.15,false);

      const hp = audioCtx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = rand(1600,3000);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(.0001,now);
      gain.gain.exponentialRampToValueAtTime(rand(.012,.035),now+.004);
      gain.gain.exponentialRampToValueAtTime(.0001,now+rand(.08,.16));

      osc.connect(gain);
      noise.connect(hp);
      hp.connect(gain);
      gain.connect(roofGain);

      osc.start(now); osc.stop(now+.18);
      noise.start(now); noise.stop(now+.14);
    }

    function triggerMetalDrop(){
      if(!playing) return;
      const now = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = rand(1300,2600);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(.0001,now);
      gain.gain.exponentialRampToValueAtTime(rand(.012,.03),now+.002);
      gain.gain.exponentialRampToValueAtTime(.0001,now+rand(.05,.11));

      const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      if(panner) panner.pan.value = rand(-.55,.55);

      osc.connect(gain);
      if(panner){ gain.connect(panner); panner.connect(metalGain); }
      else gain.connect(metalGain);

      osc.start(now); osc.stop(now+.13);
    }

    function triggerBucketDrop(){
      if(!playing) return;
      const now = audioCtx.currentTime;

      const body = audioCtx.createOscillator();
      body.type = "sine";
      body.frequency.setValueAtTime(rand(390,560),now);
      body.frequency.exponentialRampToValueAtTime(rand(250,360),now+.28);

      const overtone = audioCtx.createOscillator();
      overtone.type = "sine";
      overtone.frequency.value = rand(1250,1850);

      const high = audioCtx.createOscillator();
      high.type = "sine";
      high.frequency.value = rand(2300,3400);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(.0001,now);
      gain.gain.exponentialRampToValueAtTime(rand(.045,.085),now+.002);
      gain.gain.exponentialRampToValueAtTime(.015,now+.06);
      gain.gain.exponentialRampToValueAtTime(.0001,now+rand(.45,.8));

      const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      if(panner) panner.pan.value = rand(-.75,.75);

      body.connect(gain);
      overtone.connect(gain);
      high.connect(gain);

      if(panner){ gain.connect(panner); panner.connect(bucketGain); }
      else gain.connect(bucketGain);

      body.start(now); overtone.start(now); high.start(now);
      body.stop(now+.9); overtone.stop(now+.38); high.stop(now+.20);
    }

    function triggerThunder(){
      if(!playing) return;
      const now = audioCtx.currentTime;

      const noise = audioCtx.createBufferSource();
      noise.buffer = createNoiseBuffer(audioCtx,8,false);

      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = "lowpass";
      lowpass.frequency.setValueAtTime(320,now);
      lowpass.frequency.exponentialRampToValueAtTime(120,now+6.5);

      const peak = audioCtx.createBiquadFilter();
      peak.type = "peaking";
      peak.frequency.value = rand(55,85);
      peak.Q.value = .8;
      peak.gain.value = 9;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(.0001,now);
      gain.gain.exponentialRampToValueAtTime(rand(.10,.18),now+rand(.5,1.0));
      gain.gain.exponentialRampToValueAtTime(rand(.035,.07),now+3.2);
      gain.gain.exponentialRampToValueAtTime(.0001,now+rand(6.2,7.6));

      const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      if(panner) panner.pan.value = rand(-.3,.3);

      noise.connect(lowpass);
      lowpass.connect(peak);
      peak.connect(gain);

      if(panner){ gain.connect(panner); panner.connect(thunderGain); }
      else gain.connect(thunderGain);

      noise.start(now);
      noise.stop(now+8);
    }

    function scheduleRoof(){
      if(!playing) return;
      triggerRoofDrop();
      const t = Number(intensityInput.value);
      roofTimer = setTimeout(scheduleRoof, Math.max(45, 260 - t*1.7 + rand(0,80)));
    }

    function scheduleMetal(){
      if(!playing) return;
      if(Math.random() < .75) triggerMetalDrop();
      const t = Number(intensityInput.value);
      metalTimer = setTimeout(scheduleMetal, Math.max(180, 950 - t*5.5 + rand(0,350)));
    }

    function scheduleBucket(){
      if(!playing) return;

      triggerBucketDrop();

      if(Math.random() < .22){
        setTimeout(()=>{ if(playing) triggerBucketDrop(); }, rand(180,650));
      }

      bucketTimer = setTimeout(scheduleBucket, rand(9000,32000));
    }

    function scheduleThunder(){
      if(!playing) return;

      triggerThunder();

      if(Math.random() < .18){
        setTimeout(()=>{ if(playing) triggerThunder(); }, rand(8000,18000));
      }

      thunderTimer = setTimeout(scheduleThunder, rand(150000,360000));
    }

    function startRareSounds(){
      clearTimeout(bucketTimer);
      clearTimeout(thunderTimer);

      bucketTimer = setTimeout(scheduleBucket, rand(5000,16000));
      thunderTimer = setTimeout(scheduleThunder, rand(90000,210000));
    }

    function stopSchedulers(){
      clearTimeout(roofTimer);
      clearTimeout(metalTimer);
      clearTimeout(bucketTimer);
      clearTimeout(thunderTimer);
      roofTimer = metalTimer = bucketTimer = thunderTimer = null;
    }

    function updateIntensity(){
      intensityValue.textContent = intensityInput.value;
      if(!audioCtx) return;

      const n = Number(intensityInput.value)/100;
      ambienceGain.gain.setTargetAtTime(.20+n*.34,audioCtx.currentTime,.12);
      roofGain.gain.setTargetAtTime(.16+n*.42,audioCtx.currentTime,.12);
      metalGain.gain.setTargetAtTime(.05+n*.20,audioCtx.currentTime,.12);
      lowGain.gain.setTargetAtTime(.08+n*.10,audioCtx.currentTime,.12);
      bucketGain.gain.setTargetAtTime(.16+n*.18,audioCtx.currentTime,.12);
      thunderGain.gain.setTargetAtTime(.20+n*.12,audioCtx.currentTime,.12);

      if(playing){
        clearTimeout(roofTimer);
        clearTimeout(metalTimer);
        scheduleRoof();
        scheduleMetal();
      }
    }

    function updateVolume(){
      volumeValue.textContent = volumeInput.value + "%";
      if(audioCtx && playing){
        masterGain.gain.setTargetAtTime(Math.max(.0001,Number(volumeInput.value)/100),audioCtx.currentTime,.1);
      }
    }

    async function toggleRain(){
      setupAudio();
      if(audioCtx.state==="suspended") await audioCtx.resume();

      if(!playing){
        playing = true;
        playIcon.style.display = "none";
        pauseIcon.style.display = "block";
        catStatus.textContent = "Дождь идёт. Иногда будет слышна далёкая гроза.";

        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setValueAtTime(.0001,audioCtx.currentTime);
        masterGain.gain.exponentialRampToValueAtTime(
          Math.max(.0001,Number(volumeInput.value)/100),
          audioCtx.currentTime+1.1
        );

        updateIntensity();
        startRareSounds();
      }else{
        playing = false;
        playIcon.style.display = "block";
        pauseIcon.style.display = "none";
        catStatus.textContent = "Кошка спит. Нажми, чтобы включить дождь.";
        stopSchedulers();

        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setValueAtTime(Math.max(.0001,masterGain.gain.value),audioCtx.currentTime);
        masterGain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.7);
      }
    }

    catBtn.addEventListener("click",toggleRain);
    volumeInput.addEventListener("input",updateVolume);
    intensityInput.addEventListener("input",updateIntensity);

    hideBtn.addEventListener("click",()=>panel.classList.toggle("hidden"));

    fullscreenBtn.addEventListener("click",async()=>{
      try{
        if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      }catch(e){}
    });

    addEventListener("keydown",(e)=>{
      if(e.key.toLowerCase()==="h") panel.classList.toggle("hidden");
      if(e.key.toLowerCase()==="f"){
        if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else document.exitFullscreen().catch(()=>{});
      }
    });

    updateVolume();
    updateIntensity();
  </script>
</body>
</html>
