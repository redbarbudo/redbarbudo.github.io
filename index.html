<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c1218" />
  <title>Rain Window</title>
  <style>
    :root{
      --text: rgba(245,248,252,.92);
      --muted: rgba(235,240,245,.72);
      --glass: rgba(8,14,20,.30);
      --line: rgba(255,255,255,.13);
      --shadow: 0 12px 45px rgba(0,0,0,.34);
    }

    *{box-sizing:border-box}

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:#0b1118;
      color:var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    body{
      position:relative;
      background:
        linear-gradient(rgba(7,10,14,.20), rgba(7,10,14,.26)),
        url("./background-rain-window.png") center center / cover no-repeat fixed;
    }

    .backdrop{
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 120%, rgba(90,110,120,.08), transparent 38%),
        linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.25));
      backdrop-filter: blur(1px);
    }

    .mist{
      position:fixed;
      inset:-10%;
      pointer-events:none;
      opacity:.15;
      filter: blur(55px);
      background:
        radial-gradient(circle at 15% 30%, rgba(200,220,235,.35), transparent 15%),
        radial-gradient(circle at 75% 20%, rgba(180,205,220,.25), transparent 18%),
        radial-gradient(circle at 65% 85%, rgba(200,215,230,.18), transparent 20%);
      animation: drift 26s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to   { transform: translate3d(3%, 2%, 0) scale(1.05); }
    }

    .panel-wrap{
      position:fixed;
      inset:0;
      display:grid;
      place-items:center;
      padding:24px;
      pointer-events:none;
    }

    .panel{
      pointer-events:auto;
      width:min(520px, calc(100vw - 32px));
      padding:22px 22px 18px;
      border:1px solid var(--line);
      border-radius:22px;
      background:var(--glass);
      backdrop-filter: blur(14px) saturate(115%);
      -webkit-backdrop-filter: blur(14px) saturate(115%);
      box-shadow: var(--shadow);
      transition: opacity .28s ease, transform .28s ease;
    }

    .panel.hidden{
      opacity:0;
      transform: translateY(8px) scale(.985);
      pointer-events:none;
    }

    h1{
      margin:0 0 6px;
      font-size:clamp(24px,4vw,36px);
      font-weight:650;
      letter-spacing:-.03em;
    }

    .subtitle{
      margin:0 0 16px;
      color:var(--muted);
      line-height:1.5;
      font-size:14px;
    }

    .controls{
      display:grid;
      gap:14px;
    }

    .top-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .soft-btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.08);
      color:var(--text);
      min-height:40px;
      padding:0 14px;
      border-radius:999px;
      font:inherit;
      cursor:pointer;
      transition:.18s ease;
    }

    .soft-btn:hover{
      transform: translateY(-1px);
      background:rgba(255,255,255,.12);
    }

    .range{
      display:grid;
      grid-template-columns: 86px 1fr 46px;
      gap:12px;
      align-items:center;
      font-size:14px;
      color:var(--muted);
    }

    input[type="range"]{
      width:100%;
      accent-color:#e3eef5;
      cursor:pointer;
    }

    .cat-launch{
      position:fixed;
      right:18px;
      bottom:18px;
      width:68px;
      height:62px;
      border:none;
      background:transparent;
      padding:0;
      cursor:pointer;
      z-index:10;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
      transition: transform .18s ease, opacity .18s ease;
    }

    .cat-launch:hover{ transform: translateY(-1px) scale(1.03); }
    .cat-launch:active{ transform: scale(.97); }

    .cat-launch svg{ width:100%; height:100%; display:block; }

    .cat-status{
      position:fixed;
      right:18px;
      bottom:88px;
      max-width:220px;
      padding:8px 11px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(10,16,22,.48);
      color: var(--muted);
      font-size:12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      z-index:10;
      user-select:none;
    }

    .hint{
      position:fixed;
      left:16px;
      bottom:16px;
      padding:8px 11px;
      color:rgba(240,243,247,.64);
      font-size:12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(10,16,22,.30);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    @media (max-width:640px){
      .panel{padding:18px 16px 16px}
      .range{grid-template-columns: 76px 1fr 40px; gap:8px;}
      .cat-launch{right:14px; bottom:14px; width:62px; height:58px;}
      .cat-status{right:14px; bottom:78px;}
      .hint{left:10px; right:88px; bottom:10px}
    }
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="mist"></div>

  <div class="panel-wrap">
    <section class="panel" id="panel">
      <h1>Rain Window</h1>
      <p class="subtitle">
        Вид из окна деревенского дома. Нажми на кошку, чтобы включить или выключить дождь.
      </p>

      <div class="controls">
        <div class="top-row">
          <button class="soft-btn" id="hideBtn">Скрыть интерфейс</button>
          <button class="soft-btn" id="fullscreenBtn">На весь экран</button>
        </div>

        <label class="range">
          <span>Громкость</span>
          <input id="volume" type="range" min="0" max="100" value="42" />
          <span id="volumeValue">42%</span>
        </label>

        <label class="range">
          <span>Интенсив.</span>
          <input id="intensity" type="range" min="10" max="100" value="56" />
          <span id="intensityValue">56</span>
        </label>
      </div>
    </section>
  </div>

  <div class="cat-status" id="catStatus">Кошка спит. Нажми, чтобы запустить дождь.</div>

  <button class="cat-launch" id="catBtn" aria-label="Запустить или остановить дождь" title="Запустить или остановить дождь">
    <svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
      <path id="catShape" d="M26 40 L36 14 L54 33 Q60 30 66 33 L84 14 L94 40 Q104 52 104 66 Q104 84 90 95 Q76 106 60 106 Q44 106 30 95 Q16 84 16 66 Q16 52 26 40 Z"
            fill="rgba(30,35,40,.92)" stroke="rgba(255,255,255,.20)" stroke-width="2"/>
      <ellipse cx="48" cy="62" rx="4.7" ry="6.2" fill="#eef4f8"/>
      <ellipse cx="72" cy="62" rx="4.7" ry="6.2" fill="#eef4f8"/>
      <path d="M52 79 Q60 86 68 79" fill="none" stroke="#eef4f8" stroke-width="4" stroke-linecap="round"/>
      <path d="M60 68 L56 74 H64 Z" fill="#eef4f8"/>
      <path id="playIcon" d="M56 47 L56 77 L80 62 Z" fill="rgba(180,205,220,.85)"/>
      <g id="pauseIcon" style="display:none">
        <rect x="52" y="48" width="8" height="28" rx="2" fill="rgba(180,205,220,.9)"/>
        <rect x="66" y="48" width="8" height="28" rx="2" fill="rgba(180,205,220,.9)"/>
      </g>
    </svg>
  </button>

  <div class="hint">H — показать/скрыть панель · F — полный экран · двойной клик — вернуть панель</div>

  <script>
    const panel = document.getElementById("panel");
    const catBtn = document.getElementById("catBtn");
    const catStatus = document.getElementById("catStatus");
    const playIcon = document.getElementById("playIcon");
    const pauseIcon = document.getElementById("pauseIcon");
    const hideBtn = document.getElementById("hideBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    const volumeInput = document.getElementById("volume");
    const volumeValue = document.getElementById("volumeValue");
    const intensityInput = document.getElementById("intensity");
    const intensityValue = document.getElementById("intensityValue");

    let audioCtx = null;
    let masterGain = null;
    let ambienceGain = null;
    let roofGain = null;
    let metalGain = null;
    let lowRumbleGain = null;
    let baseNoiseSource = null;
    let lowNoiseSource = null;
    let playing = false;
    let dropTimers = [];
    let started = false;

    function setCatState(isPlaying) {
      playIcon.style.display = isPlaying ? "none" : "block";
      pauseIcon.style.display = isPlaying ? "block" : "none";
      catStatus.textContent = isPlaying
        ? "Дождь идёт. Нажми на кошку, чтобы поставить тишину."
        : "Кошка спит. Нажми, чтобы запустить дождь.";
    }

    function createNoiseBuffer(ctx, seconds = 8, tone = "pinkish") {
      const length = Math.floor(ctx.sampleRate * seconds);
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);

      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;

        if (tone === "pinkish") {
          b0 = 0.99765 * b0 + white * 0.0990460;
          b1 = 0.96300 * b1 + white * 0.2965164;
          b2 = 0.57000 * b2 + white * 1.0526913;
          data[i] = (b0 + b1 + b2 + white * 0.1848) * 0.17;
        } else {
          data[i] = white * 0.25;
        }
      }
      return buffer;
    }

    function ensureAudio() {
      if (audioCtx) return;

      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0001;
      masterGain.connect(audioCtx.destination);

      ambienceGain = audioCtx.createGain();
      ambienceGain.gain.value = 0.34;

      roofGain = audioCtx.createGain();
      roofGain.gain.value = 0.45;

      metalGain = audioCtx.createGain();
      metalGain.gain.value = 0.22;

      lowRumbleGain = audioCtx.createGain();
      lowRumbleGain.gain.value = 0.16;

      ambienceGain.connect(masterGain);
      roofGain.connect(masterGain);
      metalGain.connect(masterGain);
      lowRumbleGain.connect(masterGain);

      // Base ambient rain bed
      baseNoiseSource = audioCtx.createBufferSource();
      baseNoiseSource.buffer = createNoiseBuffer(audioCtx, 10, "pinkish");
      baseNoiseSource.loop = true;

      const hp = audioCtx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = 700;

      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 7000;

      const slightMotion = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      if (slightMotion) slightMotion.pan.value = -0.05;

      baseNoiseSource.connect(hp);
      hp.connect(lp);
      if (slightMotion) {
        lp.connect(slightMotion);
        slightMotion.connect(ambienceGain);
      } else {
        lp.connect(ambienceGain);
      }

      // Low rumble / distant room tone
      lowNoiseSource = audioCtx.createBufferSource();
      lowNoiseSource.buffer = createNoiseBuffer(audioCtx, 10, "white");
      lowNoiseSource.loop = true;

      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = "lowpass";
      lowpass.frequency.value = 260;

      lowNoiseSource.connect(lowpass);
      lowpass.connect(lowRumbleGain);

      baseNoiseSource.start();
      lowNoiseSource.start();
      started = true;
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function triggerRoofDrop() {
      if (!audioCtx || !playing) return;

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(rand(170, 260), now);

      const toneFilter = audioCtx.createBiquadFilter();
      toneFilter.type = "bandpass";
      toneFilter.frequency.value = rand(500, 1100);
      toneFilter.Q.value = rand(2, 5);

      const noise = audioCtx.createBufferSource();
      noise.buffer = createNoiseBuffer(audioCtx, 0.18, "white");

      const noiseHP = audioCtx.createBiquadFilter();
      noiseHP.type = "highpass";
      noiseHP.frequency.value = rand(1800, 3200);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(rand(0.018, 0.05), now + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + rand(0.09, 0.18));

      osc.connect(toneFilter);
      toneFilter.connect(gain);

      noise.connect(noiseHP);
      noiseHP.connect(gain);

      gain.connect(roofGain);

      osc.start(now);
      osc.stop(now + 0.22);
      noise.start(now);
      noise.stop(now + 0.16);
    }

    function triggerMetalDrop() {
      if (!audioCtx || !playing) return;

      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      osc1.type = "sine";
      osc2.type = "sine";
      osc1.frequency.setValueAtTime(rand(1300, 2200), now);
      osc2.frequency.setValueAtTime(rand(2100, 3400), now);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(rand(0.02, 0.05), now + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + rand(0.04, 0.11));

      const filter = audioCtx.createBiquadFilter();
      filter.type = "highpass";
      filter.frequency.value = 900;

      const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      if (panner) panner.pan.value = rand(-0.5, 0.5);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      if (panner) {
        gain.connect(panner);
        panner.connect(metalGain);
      } else {
        gain.connect(metalGain);
      }

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.13);
      osc2.stop(now + 0.10);
    }

    function scheduleLoop(fn, getDelay) {
      let cancelled = false;
      function tick() {
        if (cancelled) return;
        if (playing) fn();
        const id = setTimeout(tick, getDelay());
        dropTimers.push(id);
      }
      tick();
      return () => { cancelled = true; };
    }

    let cancelRoofLoop = null;
    let cancelMetalLoop = null;
    let cancelMetalLoop2 = null;

    function clearDropTimers() {
      for (const id of dropTimers) clearTimeout(id);
      dropTimers = [];
      if (cancelRoofLoop) cancelRoofLoop();
      if (cancelMetalLoop) cancelMetalLoop();
      if (cancelMetalLoop2) cancelMetalLoop2();
      cancelRoofLoop = cancelMetalLoop = cancelMetalLoop2 = null;
    }

    function updateIntensity() {
      intensityValue.textContent = intensityInput.value;
      if (!audioCtx) return;

      const n = Number(intensityInput.value) / 100;
      ambienceGain.gain.setTargetAtTime(0.18 + n * 0.38, audioCtx.currentTime, 0.15);
      roofGain.gain.setTargetAtTime(0.18 + n * 0.54, audioCtx.currentTime, 0.15);
      metalGain.gain.setTargetAtTime(0.06 + n * 0.28, audioCtx.currentTime, 0.15);
      lowRumbleGain.gain.setTargetAtTime(0.10 + n * 0.12, audioCtx.currentTime, 0.15);

      if (playing) {
        clearDropTimers();
        const roofBase = () => {
          const t = Number(intensityInput.value);
          return Math.max(35, 230 - t * 1.6 + Math.random() * 60);
        };
        const metalBase = () => {
          const t = Number(intensityInput.value);
          return Math.max(120, 850 - t * 5.5 + Math.random() * 220);
        };
        const metalBase2 = () => {
          const t = Number(intensityInput.value);
          return Math.max(260, 1600 - t * 9 + Math.random() * 350);
        };

        cancelRoofLoop = scheduleLoop(triggerRoofDrop, roofBase);
        cancelMetalLoop = scheduleLoop(triggerMetalDrop, metalBase);
        cancelMetalLoop2 = scheduleLoop(() => {
          if (Math.random() < 0.75) triggerMetalDrop();
        }, metalBase2);
      }
    }

    function updateVolume() {
      volumeValue.textContent = volumeInput.value + "%";
      if (!audioCtx || !masterGain) return;
      const target = Math.max(0.0001, Number(volumeInput.value) / 100);
      if (playing) {
        masterGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.1);
      }
    }

    async function toggleRain() {
      ensureAudio();

      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }

      if (!playing) {
        playing = true;
        setCatState(true);
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        masterGain.gain.exponentialRampToValueAtTime(
          Math.max(0.0001, Number(volumeInput.value) / 100),
          audioCtx.currentTime + 1.2
        );
        updateIntensity();
      } else {
        playing = false;
        setCatState(false);
        clearDropTimers();
        masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
        masterGain.gain.setValueAtTime(Math.max(0.0001, masterGain.gain.value), audioCtx.currentTime);
        masterGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.7);
      }
    }

    function togglePanel(){
      panel.classList.toggle("hidden");
    }

    async function toggleFullscreen(){
      try{
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (e){}
    }

    catBtn.addEventListener("click", toggleRain);
    hideBtn.addEventListener("click", togglePanel);
    fullscreenBtn.addEventListener("click", toggleFullscreen);

    volumeInput.addEventListener("input", updateVolume);
    intensityInput.addEventListener("input", updateIntensity);

    document.body.addEventListener("dblclick", () => {
      panel.classList.remove("hidden");
    });

    addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "h") togglePanel();
      if (e.key.toLowerCase() === "f") toggleFullscreen();
    });

    updateVolume();
    updateIntensity();
    setCatState(false);
  </script>
</body>
</html>
